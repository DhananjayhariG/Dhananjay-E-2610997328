<!DOCTYPE html>
<html>
<head>
    <title>Interactive Restaurant Menu</title>
</head>

<body>

    <h1>Interactive Restaurant Menu</h1>

    <p>Click on different food items to learn more about them.</p>

    <img src="food.jpg" width="600" height="400"
         alt="Restaurant Food"
         usemap="#foodmap">

    <map name="foodmap">

        <!-- Circle 1: Pizza -->
        <area shape="circle"
              coords="150,270,70"
              href="https://en.wikipedia.org/wiki/Pizza"
              alt="Pizza"
              title="Pizza"
              target="_blank">

        <!-- Circle 2: Burger -->
        <area shape="circle"
              coords="100,100,45"
              href="https://en.wikipedia.org/wiki/Hamburger"
              alt="Burger"
              title="Burger"
              target="_blank">

        <!-- Rectangle 1: French Fries -->
        <area shape="rect"
              coords="250,130,350,220"
              href="https://en.wikipedia.org/wiki/French_fries"
              alt="French Fries"
              title="French Fries"
              target="_blank">

        <!-- Rectangle 2: Menu Card -->
        <area shape="rect"
              coords="400,250,550,350"
              href="https://en.wikipedia.org/wiki/Menu"
              alt="Menu Card"
              title="Menu Card"
              target="_blank">

        <!-- Polygon 1: Sandwich -->
        <area shape="poly"
              coords="350,40,430,70,400,140,320,110"
              href="https://en.wikipedia.org/wiki/Sandwich"
              alt="Sandwich"
              title="Sandwich"
              target="_blank">

        <!-- Polygon 2: Cake Slice -->
        <area shape="poly"
              coords="450,150,520,180,500,240,430,210"
              href="https://en.wikipedia.org/wiki/Cake"
              alt="Cake Slice"
              title="Cake Slice"
              target="_blank">

        <!-- Default Area: Remaining Image -->
        <area shape="default"
              href="https://en.wikipedia.org/wiki/Food"
              alt="Other Food"
              title="Explore Other Food"
              target="_blank">

    </map>

    <h2>Food Items</h2>

    <table border="1" cellpadding="8" cellspacing="0">
        <tr>
            <th>Food Item</th>
            <th>Shape</th>
        </tr>

        <tr>
            <td>Pizza</td>
            <td>Circle</td>
        </tr>

        <tr>
            <td>Burger</td>
            <td>Circle</td>
        </tr>

        <tr>
            <td>French Fries</td>
            <td>Rectangle</td>
        </tr>

        <tr>
            <td>Menu Card</td>
            <td>Rectangle</td>
        </tr>

        <tr>
            <td>Sandwich</td>
            <td>Polygon</td>
        </tr>

        <tr>
            <td>Cake Slice</td>
            <td>Polygon</td>
        </tr>

        <tr>
            <td>Remaining Area</td>
            <td>Default</td>
        </tr>
    </table>

</body>
</html>
